name: Deploy Exam Software to Subdomain

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: exam-subdomain-deployment
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to exam.narayankhatri.com.np
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload website through FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            README.md
